<!doctype html><html lang="en"><meta charset="utf-8"><title>Eat It abilities and trunk-first visual checks</title><style>body{margin:0;background:#182c2a;color:white;font:14px system-ui}nav{position:absolute;z-index:3;display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:#192637ed}label{display:flex;gap:6px;align-items:center}canvas{display:block;width:100vw;height:100vh}output{position:absolute;z-index:3;bottom:12px;left:12px;background:#192637ed;padding:8px;max-width:80%}button,select{padding:5px}</style>
<nav><label>Scene<select id="scenario"><option>Tree choke</option><option>Tree fits</option><option>House small</option><option>House near</option><option>House fits</option><option>Car small</option><option>Car near</option><option>Car fits</option><option>Jump</option><option>Invalid landing</option><option>Strike</option><option>Burp</option><option>Pigeon</option><option>Cat</option></select></label><button id="reset">Reset</button><button id="step">Step 0.2s</button><button id="second">Step 1s</button><button id="run">Play / Pause</button><button id="minute">Advance 59s</button></nav><canvas id="arena"></canvas><output id="status"></output>
<script type="module">
import {ArenaRenderer} from '/src/games/eat-it/renderer.ts';import {createGame,stepGame} from '/src/games/eat-it/engine.ts';import {EAT,FOOD,playerRadius} from '/src/games/eat-it/config.ts';import {mouthPosition,MOUTH,foodFits} from '/src/games/eat-it/rules.ts';import {startHell,cellCenter,cellIndex,blackHoles} from '/src/games/eat-it/hell.ts';import {activateAbility} from '/src/games/eat-it/abilities.ts';import {beginFall} from '/src/games/eat-it/falling.ts';
const canvas=document.querySelector('canvas'),select=document.querySelector('select');let renderer,s,playing=false;const status=document.querySelector('output');function init(){playing=false;const name=select.value;renderer?.dispose();renderer=new ArenaRenderer(canvas,name==='Cat'?'nature':'city');s=createGame('city',[{id:'a',name:'You'},{id:'b',name:'Other'}],91,'visual',{mode:'solo'});s.food=[];s.powerups=[];s.nextFood=s.nextPower=s.nextPluto=1e9;const [p,b]=s.players;Object.assign(p,{x:1500,y:1500,facing:0});Object.assign(b,{x:3000,y:2000});const e=s.encounter;delete s.encounter;
if(['Jump','Invalid landing','Strike'].includes(name)){startHell(s);s.time=s.hell.readyAt;s.phase='hell';blackHoles(s).forEach(b=>b.warnUntil=1e9);s.hell.nextEruption=s.nextPower=1e9;Object.assign(p,cellCenter(8*EAT.hell.columns+8));Object.assign(b,cellCenter(5*EAT.hell.columns+20));const idx=cellIndex(p);for(let row=-3;row<=3;row++)for(let col=1;col<=(name==='Invalid landing'?4:3);col++)s.hell.cells[idx+row*EAT.hell.columns+col]=-1;s.powerups=[{id:s.nextId++,kind:'jump',x:p.x-100,y:p.y-100},{id:s.nextId++,kind:'strike',x:p.x-100,y:p.y+100}];p.storedJump=p.storedStrike=true;activateAbility(s,p,name==='Strike'?'strike':'jump');}
else if(name==='Burp'){p.burpAt=0;s.time=.45;}
else if(name==='Pigeon'||name==='Cat'){s.encounter=e;e.shrine=null;e.completedBy=p.id;e.item.status='delivered';p.mass=500;p.input={x:1,y:0};Object.assign(e.npc,{kind:name==='Cat'?'cat':'pigeon',phase:'friendly',targetId:p.id,until:60,since:0,nextAction:4,x:p.x+70,y:p.y});p.helper={kind:e.npc.kind,until:60,used:false,hell:false};}
else{const kind=name.startsWith('House')?'house':name.startsWith('Car')?'car':'tree';const threshold=FOOD[kind].devourArea/Math.PI/(4*MOUTH.radius)**2;p.mass=name.endsWith('near')?threshold*.99:name.endsWith('fits')?kind==='tree'?500:threshold*1.03:36;const m=mouthPosition(p,playerRadius(p,0));const f={...m,id:s.nextId++,kind,vx:0,vy:0,z:0,vz:0,rotation:0,target:null,capturedAt:0};s.food=[f];if(kind!=='tree'){if(name.endsWith('fits')){f.x=m.x+playerRadius(p,0)*MOUTH.radius+FOOD[kind].width*.249;beginFall(f,p,0);f.target=p.id;}else{p.x-=90;p.input={x:1,y:0};}}}
render();}
function render(){renderer.resize(innerWidth,innerHeight);renderer.draw(s,'a',1/30,'You',false);const p=s.players[0],f=s.food[0];status.textContent=`${select.value} · ${s.time.toFixed(2)}s · ${p.ability?.kind??(p.fallingAt!==undefined?'falling':f?.stuck?'canopy stuck':f?.spit?'spitting':f?.target?'trunk / object entering':'grounded')} · z ${f?.z?.toFixed(1)??'—'} · ${s.encounter?.npc.phase??''} ${s.encounter?.npc.feeds??''}`;}
function advance(n){for(let i=0;i<n;i++)stepGame(s);render();}select.onchange=init;document.querySelector('#reset').onclick=init;document.querySelector('#step').onclick=()=>advance(6);document.querySelector('#second').onclick=()=>advance(30);document.querySelector('#minute').onclick=()=>advance(1770);document.querySelector('#run').onclick=()=>playing=!playing;let previous=performance.now(),acc=0;function frame(t){acc+=Math.min(.1,(t-previous)/1000);previous=t;while(acc>=1/30){if(playing)stepGame(s);acc-=1/30;}render();requestAnimationFrame(frame);}init();requestAnimationFrame(frame);
</script></html>
