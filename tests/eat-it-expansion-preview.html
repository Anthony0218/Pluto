<!doctype html><html lang="en"><meta charset="utf-8"><title>Eat It expansion visual QA</title>
<style>body{margin:0;font:14px system-ui;background:#171522;color:white}nav{position:absolute;top:0;left:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#171522de}button,select{padding:8px}canvas{display:block;width:100vw;height:100vh}output{position:absolute;bottom:10px;left:12px;z-index:5;background:#171522dd;padding:10px}</style>
<nav><label>Scene <select id="scene"><option value="underpass">Underpass and Pluto</option><option value="pigeon">Pigeon ride</option><option value="cat">Cat ride</option><option value="hell">Hell</option><option value="hellPigeon">Hell pigeon</option><option value="hellCat">Hell cat</option><option value="fall">Lava fall</option><option value="tie">Simultaneous tie</option></select></label><button id="reset">Reset</button><button id="play">Play / pause</button><button id="advance">Advance 0.5s</button><button id="ride">Escape</button></nav><canvas id="arena"></canvas><output id="status"></output>
<script type="module">
import { ArenaRenderer } from '/src/games/eat-it/renderer.ts';
import { createGame,stepGame } from '/src/games/eat-it/engine.ts';
import { activateEscape } from '/src/games/eat-it/escape.ts';
import { startHell,cellCenter } from '/src/games/eat-it/hell.ts';
let s,r,playing=false;const select=document.querySelector('#scene');
function reset(){r?.dispose();document.querySelector('#arena').replaceWith(Object.assign(document.createElement('canvas'),{id:'arena'}));s=createGame('city',[{id:'a',name:'You'},{id:'b',name:'Bot',bot:true},{id:'c',name:'Bot 2',bot:true}],33,'visual',{mode:'solo'});s.food=[];s.powerups=[];s.nextFood=s.nextPower=s.nextPluto=1e6;delete s.encounter;s.players.forEach((p,i)=>Object.assign(p,{x:1500+i*300,y:1200,bot:false}));const p=s.players[0],scene=select.value;
 if(scene==='underpass'){for(const [i,kind] of ['car','house','plutoTiny','plutoSmall','plutoMedium','plutoLarge','plutoGiant'].entries())s.food.push({id:s.nextId++,kind,x:i<2?1470+i*230:1160+(i-2)*170,y:i<2?1190:1420,vx:0,vy:0,z:0,vz:0,rotation:0,target:null,capturedAt:0});p.input={x:1,y:0};}
 if(scene.includes('igeon')||scene.includes('at')){const kind=scene.toLowerCase().includes('cat')?'cat':'pigeon';s.encounter={completedBy:'a',shrine:null,item:{kind:kind==='cat'?'catTree':'scroll',status:'delivered',ownerId:null,home:{x:500,y:500},x:500,y:500},npc:{kind,phase:'friendly',since:0,until:30,x:p.x-100,y:p.y,facing:0,targetId:'a',destination:{x:500,y:500},origin:{x:500,y:500},nextAction:4,actionAt:0,attacks:0,feeds:0}};p.helper={kind,hell:false,until:30,used:false};}
 if(scene.startsWith('hell')||scene==='fall'||scene==='tie'){startHell(s);s.time=s.hell.readyAt;stepGame(s);s.hell.cells.forEach((_,i)=>{if(i%20>7&&i%20<11&&i>60)s.hell.cells[i]=-1});if(scene==='fall'||scene==='tie'){if(scene==='tie')s.hell.cells.fill(-1);else p.x=700;}else{s.players[1].bot=true;s.players[2].bot=true;}}
 r=new ArenaRenderer(document.querySelector('#arena'),'city');r.resize(innerWidth,innerHeight);playing=false;
}
select.onchange=reset;document.querySelector('#reset').onclick=reset;document.querySelector('#play').onclick=()=>playing=!playing;document.querySelector('#advance').onclick=()=>{for(let i=0;i<15;i++)stepGame(s)};document.querySelector('#ride').onclick=()=>{activateEscape(s,s.players[0]);for(let i=0;i<30;i++)stepGame(s)};window.onresize=()=>r.resize(innerWidth,innerHeight);reset();
let previous=performance.now(),acc=0;function frame(now){const dt=Math.min(.1,(now-previous)/1000);previous=now;if(playing){acc+=dt;while(acc>=1/30){stepGame(s);acc-=1/30}}r.draw(s,'a',dt,'You',false);document.querySelector('#status').textContent=`${s.phase} · ${s.time.toFixed(2)}s · ${s.status} ${s.result??''} · ${s.players.filter(p=>p.alive).length} alive · ${s.players[0].escape?.kind??'no ride'}`;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
