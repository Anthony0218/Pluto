<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eat It performance check</title><style>body{margin:0;background:#192624;color:#eff5e6;font:12px system-ui}nav{display:flex;flex-wrap:wrap;gap:8px;padding:8px}#arena{position:relative;width:100vw;height:calc(100vh - 150px)}canvas{width:100%;height:100%}output{display:block;white-space:pre-wrap;padding:8px}button,select{font:inherit}</style></head><body><nav><label>Map <select id="map"><option>city</option><option>nature</option><option>candy</option><option>frozen</option></select></label><label>Character size <select id="mass"><option value="36">Starting</option><option value="9000">Large</option></select></label><button id="run">Measure 15 seconds</button></nav><output id="metrics">Ready. Actual renderer, eight players, normal object population. A phone viewport uses this computer's GPU, not phone hardware.</output><div id="arena"><canvas></canvas></div><script type="module">
import {createGame,fillBots,stepGame} from '/src/games/eat-it/engine.ts';
import {ArenaRenderer} from '/src/games/eat-it/renderer.ts';
const canvas=document.querySelector('canvas'),out=document.querySelector('output');
let game,renderer,last=0,accumulator=0,measureAt=Infinity,frames=[],simulation=[],render=[],running=false;
const quantile=(samples,q)=>[...samples].sort((a,b)=>a-b)[Math.floor((samples.length-1)*q)]??0;
function start(){renderer?.dispose();game=createGame(document.querySelector('#map').value,fillBots([{id:'a',name:'You'}],8),42,'performance',{mode:'solo',hellEnabled:false,livesEnabled:false,animalsEnabled:false,matchDuration:1200});game.players[0].mass=Number(document.querySelector('#mass').value);game.players[0].input={x:1,y:.3};renderer=new ArenaRenderer(canvas,game.map);renderer.resize(canvas.clientWidth,canvas.clientHeight);last=0;accumulator=0;measureAt=performance.now()+3000;frames=[];simulation=[];render=[];running=true;out.textContent='Warming up for 3 seconds, then measuring 15 seconds…';}
document.querySelector('#run').onclick=start;
function draw(now){if(renderer&&running){const frame=last?now-last:0,dt=Math.min(.1,frame/1000);last=now;accumulator+=dt;const begin=performance.now();while(accumulator>=1/30){stepGame(game,1/30);accumulator-=1/30;}const simulationMs=performance.now()-begin,renderStart=performance.now();renderer.draw(game,'a',dt,'You',false);const renderMs=performance.now()-renderStart;if(running&&now>=measureAt){frames.push(frame);simulation.push(simulationMs);render.push(renderMs);if(now>=measureAt+15000){running=false;const metrics={map:game.map,mass:Number(document.querySelector('#mass').value),viewport:[canvas.clientWidth,canvas.clientHeight],objects:game.food.length,drawCalls:renderer.renderer.info.render.calls,triangles:renderer.renderer.info.render.triangles,frames:frames.length,fps:+(frames.length/(frames.reduce((a,b)=>a+b,0)/1000)).toFixed(1),frameP50Ms:+quantile(frames,.5).toFixed(2),frameP95Ms:+quantile(frames,.95).toFixed(2),frameP99Ms:+quantile(frames,.99).toFixed(2),simulationP95Ms:+quantile(simulation,.95).toFixed(2),renderCpuP95Ms:+quantile(render,.95).toFixed(2),over50ms:frames.filter(f=>f>50).length};out.textContent=JSON.stringify(metrics,null,2);}}}requestAnimationFrame(draw)}requestAnimationFrame(draw);new ResizeObserver(()=>renderer?.resize(canvas.clientWidth,canvas.clientHeight)).observe(document.querySelector('#arena'));
</script></body></html>
