<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Eat It visual check</title><style>body{margin:0;background:#192624;color:#eff5e6;font:14px system-ui}#arena{position:relative;width:100vw;height:calc(100vh - 50px)}canvas{width:100%;height:100%}nav{height:50px;display:flex;align-items:center;gap:10px;padding:0 14px}button{background:#c3ee75;border:0;padding:8px 12px;border-radius:8px}</style></head><body><nav><strong>Eat It visual check</strong><button data-map="city">City</button><button data-map="nature">Nature</button><button data-map="candy">Candy</button><button data-map="frozen">Frozen</button><button id="hell">Hell showdown</button></nav><div id="arena"><canvas></canvas></div><script type="module">
import {createGame,stepGame} from '/src/games/eat-it/engine.ts';
import {ArenaRenderer} from '/src/games/eat-it/renderer.ts';
import {startHell} from '/src/games/eat-it/hell.ts';
import {FOOD} from '/src/games/eat-it/config.ts';
let game,renderer,last=performance.now();const canvas=document.querySelector('canvas');
function start(map){renderer?.dispose();game=createGame(map,[{id:'a',name:'You'},{id:'b',name:'Snack'},{id:'c',name:'Goliath'}],567,'visual',{mode:'solo',hellEnabled:false,livesEnabled:false,animalsEnabled:false});game.food=[];game.powerups=[];game.nextFood=game.nextPower=game.nextFactory=game.nextHumans=game.nextBig=1e9;
const p=game.players[0],x=map==='nature'?2480:map==='candy'?1500:map==='frozen'?1900:1800,y=map==='nature'?560:map==='candy'?775:map==='frozen'?1520:1300;Object.assign(p,{x,y,mass:650,facing:-Math.PI/2});Object.assign(game.players[1],{x:x+150,y:y+120,mass:80,facing:1});Object.assign(game.players[2],{x:x-350,y:y+260,mass:9000,facing:1});
const landmarks=map==='city'?['factoryCart','factoryWorks']:map==='nature'?['giantMushroom','ancientStump']:map==='candy'?['giantCupcake','jellyMountain']:['iceberg','glacier'];const items=[[landmarks[0],-120,-210],[landmarks[1],160,-340],['human',-65,110],['human',-100,125],['fish',80,95],['candyMint',-10,-145],['chocolate',35,-145],['jelly',80,-140],['snowCone',125,-130],['iceCrystal',160,-130],['donut',220,40],['burger',240,100]];for(const [kind,dx,dy] of items)game.food.push({id:game.nextId++,kind,x:x+dx,y:y+dy,z:0,vz:0,vx:0,vy:0,rotation:kind.startsWith('factory')?0:Math.PI/2,target:null,capturedAt:0,...(kind==='fish'?{rewardGrowth:1000,golden:true}:{})});if(map==='candy')game.food.push({id:game.nextId++,kind:'coin',x:x+95,y:y+95,z:0,vz:0,vx:0,vy:0,rotation:0,target:null,capturedAt:0,rewardGrowth:150});for(const [i,kind] of ['speed','shield','magnet','multiplier','jump','strike'].entries())game.powerups.push({id:game.nextId++,kind,x:x-280+i*90,y:y-50});renderer=new ArenaRenderer(canvas,map);renderer.resize(canvas.clientWidth,canvas.clientHeight);}
document.querySelector('#hell').onclick=()=>{game.settings.hellEnabled=true;startHell(game);game.time=game.hell.readyAt;game.phase='hell';};
for(const b of document.querySelectorAll('button[data-map]'))b.onclick=()=>start(b.dataset.map);start('city');function draw(now){renderer.draw(game,'a',Math.min(.04,(now-last)/1000),'You',false);last=now;requestAnimationFrame(draw)}requestAnimationFrame(draw);window.addEventListener('resize',()=>renderer.resize(canvas.clientWidth,canvas.clientHeight));
</script></body></html>
